<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<style>
    #product{
        padding: 60px 30px;
    }
    .product-text{
        display: flex;
        justify-content: space-between;
    }
    .container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        max-width: 600px;
        gap: 30px;
    }
    .card{
        width: 280px;
        overflow: hidden;
        background: #ccc;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        position: relative;
        padding: 10px;
    }
    .card img{
        width: 100%;
        height: 250px;
        object-fit: contain;
    }
    .heart{
        position: absolute;
        top: 0;
        left: 0;
    }
    .card:nth-child(n+4){
        display: none;
    }
    .container.show-all .card{
        display: block;
    }


</style>

    <section id="product">
