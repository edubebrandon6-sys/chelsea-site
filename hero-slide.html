<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero-slider</title>
    <link rel="stylesheet" href="hero-slider.css">
</head>
<body>
    <section id="hero">
        <div class="slide active">
            <h1>Discover New Gadget</h1>
            <p>Explore the latest technology.</p>
            <img src="head-removebg-preview.png" alt="headphone">
        </div>
        <div class="slide">
            <h1>Powerful headphones</h1>
            <p>Enjoy music with premium sound.</p>
            <img src="watch-removebg-preview.png" alt="smartwatch">
        </div>
        <div class="slide">
            <h1>Smart Watches</h1>
            <p>Upgrade your everyday style.</p>
            <img src="sneaker-removebg-preview.png" alt="sneakers">
        </div>
        <button class="prev"><</button>
        <button class="next">></button>
    </section>
    <script src="hero-slider.js"></script>
</body>
</html>
